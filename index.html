<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>Flappy Ghost</title>

	<link rel="stylesheet" href="style.css">

	<style>
	
	</style>
</head>

<body>
	<main>
	
		<h1> Welcome to Flappy Ghost!</h1>
		<h2 id="startMsg">Select your difficulty!</h2>
		<input type="radio" id="easy" name="difficulty" checked> 
		<input type="radio" id="medium" name="difficulty"> 
		<input type="radio" id="hard" name="difficulty"> 
		<label id="easyLabel" for="easy">Easy</label> 
		<label id="mediumLabel" for="medium">Medium</label> 
		<label id="hardLabel" for="hard">Hard</label>
	

	<input type="button" id="startBtn" value="Start" onclick="startGameFromButton()">

	<!-- Load p5.js library -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>

	<!-- Your sketch -->
	<script src="sketch.js"></script>
	</main> 
</body>

</html>
