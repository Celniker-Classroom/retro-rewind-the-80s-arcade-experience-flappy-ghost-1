<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />

	<title>Flappy Ghost</title>

	<link rel="stylesheet" href="style.css">

	<style>
	
	</style>
</head>

<body>
	<main>
		<div id="menu">
		<h1> Welcome to Flappy Ghost!</h1>
		<h2 id="startMsg">Select your difficulty!</h2>

		<div class="option">
			<input type="radio" id="easy" name="difficulty" checked>
  			<label for="easy">Easy</label>
		</div>

		<div class="option">
			<input type="radio" id="medium" name="difficulty">
			<label for="medium">Medium</label>
		</div>

		<div class="option">
			<input type="radio" id="hard" name="difficulty">
			<label for="hard">Hard</label>
		</div>

		<input type="button" id="startBtn" value="Start" onclick="startGameFromButton()">

			</div>

	<!-- Load p5.js library -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.min.js"></script>

	<!-- Your sketch -->
	<script src="sketch.js"></script>
	</main> 
</body>

</html>
